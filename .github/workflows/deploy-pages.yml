name: Deploy Campania Life to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: SPA fallback
        run: cp client/dist/index.html client/dist/404.html
      - name: Install Playwright Chromium
        working-directory: client
        # Nessun --with-deps: le dipendenze di sistema sono già presenti
        # sull'runner GitHub e l'installazione apt era la causa del failure.
        run: npx playwright install chromium
      - name: Mobile start smoke (touch)
        working-directory: client
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
          CL_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$CL_BASE_URL" >/dev/null && break
            sleep 1
          done
          npm run test:mobile-start
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
